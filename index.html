    <script>
      // Set the theme before first paint. Doing this in React would flash the
      // wrong palette for a frame on every load.
      (function () {
        try {
          var stored = localStorage.getItem('hgh.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#0b1417' : '#dff1f1');
        } catch (e) {}
      })();
    </script>
  </head>
